[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mavis-local"
version = "0.1.0"
description = "Evidence-led local coding orchestration for Mavis"
requires-python = ">=3.11"
dependencies = ["mcp>=1.16,<2"]

[project.scripts]
mavis-service = "mavis.cli:main"

[tool.setuptools]
packages = ["mavis"]
